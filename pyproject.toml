[project]
name = "ai-pdf-summarizer"
version = "0.1.0"
description = "Native Python desktop tool for AI-powered PDF summarization via Groq LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Enver Emirhan Aktürk" }
]
dependencies = [
    "pypdf>=5.0.0",
    "groq>=0.9.0",
    "python-dotenv>=1.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []